name: amanah
description: Encrypted personal data vault
publish_to: "none"
version: 1.4.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  drift: ^2.32.0
  sqlite3: ^3.0.0
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  archive: ^4.0.7
  # Google Drive sync (same Cloud project as Budget Pro — separate Android OAuth client)
  google_sign_in: ^6.3.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.10
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
